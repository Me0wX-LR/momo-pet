<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸毛毛</title>
<link rel="stylesheet" href="faker.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #f4f4f4;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
    overflow: auto;
    user-select: none;
    touch-action: none;
  }
  #stage {
    position: relative;
    width: min(480px, 70vh, 86vw);
    aspect-ratio: 1;
    flex: 0 0 auto;
    background: #000;
    border: 1px solid #1c1c1c;
    overflow: hidden;
    cursor: pointer;
    touch-action: none;
  }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    pointer-events: none;
    transform: scale(0.92);
    transition: transform 180ms ease;
  }
  #stage[data-phase="calm"][data-hold="1"] #view,
  #stage[data-phase="intro"][data-hold="1"] #view { transform: scale(0.96); }
  #stage[data-phase="warn"] #view { transform: scale(0.98); }
  #stage[data-phase="danger"] {
    box-shadow: inset 0 0 0 8px #e2b340, 0 0 36px rgba(226, 179, 64, 0.55);
    border-color: #e2b340;
  }
  #stage[data-phase="swat"], #stage[data-phase="lose"] { animation: shake 180ms linear; }
  #stage[data-phase="win"] #view, #stage[data-phase="clear"] #view { transform: scale(1); }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
  }
  #banner {
    position: absolute;
    z-index: 2;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 0.08em;
    pointer-events: none;
    text-shadow: 0 2px 14px #000;
    min-height: 1.1em;
  }
  #banner.warn { color: #f0c36a; }
  #banner.pull { color: #ffe7a3; }
  #banner.safe { color: #d7f0c4; }
  #banner.hit { color: #ff6b6b; }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 28px;
    gap: 10px;
    background: rgba(0, 0, 0, 0.64);
  }
  #overlay[hidden] { display: none !important; }
  .ov-title { font-size: 32px; font-weight: 700; line-height: 1.15; }
  #overlay p { margin: 0; max-width: 34ch; color: #dedede; font-size: 16px; line-height: 1.45; }
  #overlay .ov-hint { color: #9a9a9a; }
  .readout { min-width: 300px; max-width: 400px; }
  .goal { color: #e2b340; font-size: 18px; letter-spacing: 0.04em; margin-bottom: 8px; }
  .label { color: #9a9a9a; font-size: 15px; letter-spacing: 0.04em; }
  .meter-row { display: flex; align-items: baseline; justify-content: space-between; }
  #sleep-num { font-size: 64px; line-height: 0.95; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
  .bar { height: 14px; margin: 10px 0 18px; background: #1c1c1c; border-radius: 99px; overflow: hidden; }
  #sleep-fill { height: 100%; width: 0%; background: #e2b340; }
  .hands { display: flex; gap: 8px; margin: 6px 0 8px; }
  .pip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #e2b340; background: #e2b340; }
  .pip.off { background: transparent; border-color: #555; }
  .status { font-size: 28px; line-height: 1.35; margin: 12px 0 6px; min-height: 1.35em; }
  .meta { color: #bdbdbd; font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .help { color: #8d8d8d; font-size: 15px; line-height: 1.45; margin-top: 12px; max-width: 38ch; }
  #pause-btn, .langs button, #next-btn, #retry-btn, #save-btn {
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  #pause-btn, .langs button {
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 12px;
    min-height: 40px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  #pause-btn { margin-top: 0; }
  a.back-portal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 8px 14px;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  .langs { display: flex; gap: 8px; margin-top: 16px; }
  .langs button[aria-pressed="true"] { border-color: #f4f4f4; }
  .result { margin-top: 16px; }
  .result[hidden] { display: none !important; }
  .result h2 { margin: 0 0 8px; font-size: 30px; }
  .result p { margin: 0 0 8px; line-height: 1.45; }
  #score-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  #score-form[hidden] { display: none !important; }
  #name {
    font: inherit;
    font-size: 16px;
    width: 12ch;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #666;
    background: #111;
    color: #fff;
  }
  #save-btn, #next-btn, #retry-btn {
    min-height: 48px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #e2b340;
    background: #e2b340;
    color: #1a1a1a;
    font-weight: 700;
  }
  #retry-btn { background: transparent; color: #f4f4f4; }
  #save-msg { width: 100%; min-height: 1.3em; color: #d7d7d7; font-size: 14px; }
  .board-title { margin: 16px 0 8px; font-size: 15px; color: #9a9a9a; }
  .board { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
  .board li {
    display: grid;
    grid-template-columns: 1.6em 1fr auto auto;
    gap: 8px;
    padding: 3px 0;
    color: #d0d0d0;
  }
  .board .empty { display: block; color: #8d8d8d; }
  .board .mine { color: #ffe7a3; font-weight: 700; }
  @media (max-width: 860px) {
    body {
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      min-height: 0;
      height: 100dvh;
      overflow: auto;
      padding: env(safe-area-inset-top) 0 calc(12px + env(safe-area-inset-bottom));
    }
    #stage { width: min(92vw, 42dvh); margin-top: 6px; }
    #banner { font-size: 32px; top: 8px; }
    .readout { min-width: 0; width: 100%; padding: 0 16px; box-sizing: border-box; }
    #sleep-num { font-size: 48px; }
    .help, #side-wrap { display: none; }
    .langs button, #pause-btn, a.back-portal, #next-btn, #retry-btn, #save-btn { min-height: 44px; }
  }
</style>
</head>
<body>
  <div id="stage" data-phase="start" data-hold="0">
    <img id="view" alt="毛毛" width="768" height="768" draggable="false">
    <div id="banner"></div>
    <div id="overlay"><div class="ov-title">載入中</div></div>
  </div>
  <div class="readout">
    <div class="goal" id="goal"></div>
    <div class="meter-row">
      <span class="label" id="sleep-label">安眠</span>
      <span id="sleep-num">0</span>
    </div>
    <div class="bar"><div id="sleep-fill"></div></div>
    <div class="label" id="hand-label">剩低</div>
    <div class="hands" id="hands"></div>
    <div class="status" id="status"></div>
    <div class="meta" id="meta"></div>
    <div class="help" id="help"></div>
    <div class="actions">
      <button type="button" id="pause-btn">暫停</button>
      <a class="back-portal" id="back-portal" href="/" target="_top">返主選單</a>
    </div>
    <div class="result" id="result" hidden>
      <h2 id="result-title"></h2>
      <p id="result-body"></p>
      <form id="score-form" hidden>
        <label id="name-label" for="name">名稱</label>
        <input id="name" name="name" maxlength="10" autocomplete="nickname" enterkeyhint="done">
        <button id="save-btn" type="submit">記入排行</button>
        <div id="save-msg"></div>
      </form>
      <div id="end-wrap">
        <div class="board-title" id="end-board-title"></div>
        <ol class="board" id="end-board"></ol>
      </div>
      <button type="button" id="next-btn" hidden>下一關</button>
      <button type="button" id="retry-btn" hidden>由第 1 關再嚟</button>
      <a class="back-portal" id="back-portal-end" href="/" target="_top">返主選單</a>
    </div>
    <div id="side-wrap">
      <div class="board-title" id="side-board-title"></div>
      <ol class="board" id="side-board"></ol>
    </div>
    <div class="langs">
      <button type="button" data-lang="zh-Hant">繁體</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="zh-Hans">简体</button>
    </div>
  </div>
<script src="faker-policy.js"></script>

  event.preventDefault();
  pointerDown = true;
  try { stage.setPointerCapture(event.pointerId); } catch (err) {}
  onPress(performance.now());
  syncHold();
});
window.addEventListener("pointerup", () => {
  if (fakerOn()) return;
  pointerDown = false;
  syncHold();
});
window.addEventListener("pointercancel", () => {
  if (fakerOn()) return;
  pointerDown = false;
  syncHold();
});
window.addEventListener("keydown", (event) => {
  if (event.target.closest("input, textarea, button")) return;
  if (event.repeat) return;
  if (event.code === "Escape") {
    event.preventDefault();
    togglePause();
    return;
  }
  if (event.code === "Space") {
    if (fakerOn()) {
      event.preventDefault();
      return;
    }
    if (phase === "clear" || phase === "win" || phase === "lose") {
      event.preventDefault();
      return;
    }
    event.preventDefault();
    keyHold = true;
    onPress(performance.now());
    syncHold();
  }
});
window.addEventListener("keyup", (event) => {
  if (event.code !== "Space" || fakerOn()) return;
  keyHold = false;
  syncHold();
});

loadLang();
if (fakerOn()) {
  document.body.dataset.faker = "1";
  MomoFaker.mount("pet");
  MomoFaker.syncLang(lang);
}
applyStatic();
loadBoard();
setInterval(() => {
  if (document.hidden) return;
  loadBoard();
}, 5000);

const needed = Object.keys(ART).length;
for (const name of Object.keys(ART)) {
  const img = new Image();
  frames[name] = img;
  const done = () => {
    if (img.__counted) return;
    img.__counted = true;
    loaded += 1;
    if (!readyStarted) {
      const title = overlay.querySelector(".ov-title");
      if (title) title.textContent = T().loading + " " + loaded + " / " + needed;
    }
    if (loaded === needed) boot();
  };
  img.onload = done;
  img.onerror = done;
  img.src = ART[name];
  if (img.complete) done();
}
function boot() {
  const failed = Object.values(frames).filter((img) => !img.naturalWidth).length;
  if (failed) {
    showOverlay(T().missingTitle, [T().missing], "");
    statusKey = "missing";
    paint(performance.now());
    return;
  }
  readyStarted = true;
  phase = "start";
  statusKey = "start";
  showPose();
  if (fakerOn()) showOverlay(T().fakerTitle, T().fakerStart, T().fakerHint);
  else showOverlay(T().startTitle, T().start, T().startHint);
  paint(performance.now());
  if (fakerOn()) {
    const decision = MomoFaker.decidePet("start", false, performance.now(), null, 0);
    MomoFaker.note(decision);
    MomoFaker.planAt(decision.at, (at) => {
      if (phase === "start") beginRun(at);
    });
    MomoFaker.startMusic();
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>

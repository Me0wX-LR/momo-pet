<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摸毛毛</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #f4f4f4;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
    overflow: auto;
    user-select: none;
    touch-action: none;
  }
  #stage {
    position: relative;
    width: min(480px, 70vh, 86vw);
    aspect-ratio: 1;
    flex: 0 0 auto;
    background: #000;
    border: 1px solid #1c1c1c;
    overflow: hidden;
    cursor: pointer;
    touch-action: none;
  }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    pointer-events: none;
    transform: scale(0.92);
    transition: transform 180ms ease;
  }
  #stage[data-phase="calm"][data-hold="1"] #view,
  #stage[data-phase="intro"][data-hold="1"] #view { transform: scale(0.96); }
  #stage[data-phase="warn"] #view { transform: scale(0.98); }
  #stage[data-phase="danger"] {
    box-shadow: inset 0 0 0 8px #e2b340, 0 0 36px rgba(226, 179, 64, 0.55);
    border-color: #e2b340;
  }
  #stage[data-phase="swat"], #stage[data-phase="lose"] { animation: shake 180ms linear; }
  #stage[data-phase="win"] #view, #stage[data-phase="clear"] #view { transform: scale(1); }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
  }
  #banner {
    position: absolute;
    z-index: 2;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 0.08em;
    pointer-events: none;
    text-shadow: 0 2px 14px #000;
    min-height: 1.1em;
  }
  #banner.warn { color: #f0c36a; }
  #banner.pull { color: #ffe7a3; }
  #banner.safe { color: #d7f0c4; }
  #banner.hit { color: #ff6b6b; }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 28px;
    gap: 10px;
    background: rgba(0, 0, 0, 0.64);
  }
  #overlay[hidden] { display: none !important; }
  .ov-title { font-size: 32px; font-weight: 700; line-height: 1.15; }
  #overlay p { margin: 0; max-width: 34ch; color: #dedede; font-size: 16px; line-height: 1.45; }
  #overlay .ov-hint { color: #9a9a9a; }
  .readout { min-width: 300px; max-width: 400px; }
  .goal { color: #e2b340; font-size: 18px; letter-spacing: 0.04em; margin-bottom: 8px; }
  .label { color: #9a9a9a; font-size: 15px; letter-spacing: 0.04em; }
  .meter-row { display: flex; align-items: baseline; justify-content: space-between; }
  #sleep-num { font-size: 64px; line-height: 0.95; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
  .bar { height: 14px; margin: 10px 0 18px; background: #1c1c1c; border-radius: 99px; overflow: hidden; }
  #sleep-fill { height: 100%; width: 0%; background: #e2b340; }
  .hands { display: flex; gap: 8px; margin: 6px 0 8px; }
  .pip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #e2b340; background: #e2b340; }
  .pip.off { background: transparent; border-color: #555; }
  .status { font-size: 28px; line-height: 1.35; margin: 12px 0 6px; min-height: 1.35em; }
  .meta { color: #bdbdbd; font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .help { color: #8d8d8d; font-size: 15px; line-height: 1.45; margin-top: 12px; max-width: 38ch; }
  #pause-btn, .langs button, #next-btn, #retry-btn, #save-btn {
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  #pause-btn, .langs button {
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 12px;
    min-height: 40px;
  }
  #pause-btn { margin-top: 12px; }
  .langs { display: flex; gap: 8px; margin-top: 16px; }
  .langs button[aria-pressed="true"] { border-color: #f4f4f4; }
  .result { margin-top: 16px; }
  .result[hidden] { display: none !important; }
  .result h2 { margin: 0 0 8px; font-size: 30px; }
  .result p { margin: 0 0 8px; line-height: 1.45; }
  #score-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  #score-form[hidden] { display: none !important; }
  #name {
    font: inherit;
    font-size: 16px;
    width: 12ch;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #666;
    background: #111;
    color: #fff;
  }
  #save-btn, #next-btn, #retry-btn {
    min-height: 48px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #e2b340;
    background: #e2b340;
    color: #1a1a1a;
    font-weight: 700;
  }
  #retry-btn { background: transparent; color: #f4f4f4; }
  #save-msg { width: 100%; min-height: 1.3em; color: #d7d7d7; font-size: 14px; }
  .board-title { margin: 16px 0 8px; font-size: 15px; color: #9a9a9a; }
  .board { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
  .board li {
    display: grid;
    grid-template-columns: 1.6em 1fr auto auto;
    gap: 8px;
    padding: 3px 0;
    color: #d0d0d0;
  }
  .board .empty { display: block; color: #8d8d8d; }
  .board .mine { color: #ffe7a3; font-weight: 700; }
  @media (max-width: 860px) {
    body {
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      min-height: 0;
      height: 100dvh;
      overflow: auto;
      padding: env(safe-area-inset-top) 0 calc(12px + env(safe-area-inset-bottom));
    }
    #stage { width: min(92vw, 42dvh); margin-top: 6px; }
    #banner { font-size: 32px; top: 8px; }
    .readout { min-width: 0; width: 100%; padding: 0 16px; box-sizing: border-box; }
    #sleep-num { font-size: 48px; }
    .help, #side-wrap { display: none; }
    .langs button, #pause-btn, #next-btn, #retry-btn, #save-btn { min-height: 44px; }
  }
</style>
</head>
<body>
  <div id="stage" data-phase="start" data-hold="0">
    <img id="view" alt="毛毛" width="768" height="768" draggable="false">
    <div id="banner"></div>
    <div id="overlay"><div class="ov-title">載入中</div></div>
  </div>
  <div class="readout">
    <div class="goal" id="goal"></div>
    <div class="meter-row">
      <span class="label" id="sleep-label">安眠</span>
      <span id="sleep-num">0</span>
    </div>
    <div class="bar"><div id="sleep-fill"></div></div>
    <div class="label" id="hand-label">剩低</div>

    <div class="meta" id="meta"></div>
    <div class="help" id="help"></div>

      <form id="score-form" hidden>

        <input id="name" name="name" maxlength="10" autocomplete="nickname" enterkeyhint="done">
        <button id="save-btn" type="submit">記入排行</button>

      </form>
      <div id="end-wrap">
        <div class="board-title" id="end-board-title"></div>

      </div>
      <button type="button" id="next-btn" hidden>下一關</button>
      <button type="button" id="retry-btn" hidden>由第 1 關再嚟</button>
    </div>
    <div id="side-wrap">
      <div class="board-title" id="side-board-title"></div>
      <ol class="board" id="side-board"></ol>
    </div>
    <div class="langs">
      <button type="button" data-lang="zh-Hant">繁體</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="zh-Hans">简体</button>
    </div>

const stage = document.getElementById("stage");
const view = document.getElementById("view");
const banner = document.getElementById("banner");
const overlay = document.getElementById("overlay");
const sleepNum = document.getElementById("sleep-num");
const sleepFill = document.getElementById("sleep-fill");
const handsEl = document.getElementById("hands");
const statusEl = document.getElementById("status");
const metaEl = document.getElementById("meta");
const resultEl = document.getElementById("result");
const formEl = document.getElementById("score-form");
const nameEl = document.getElementById("name");
const saveBtn = document.getElementById("save-btn");
const saveMsg = document.getElementById("save-msg");
const nextBtn = document.getElementById("next-btn");
const retryBtn = document.getElementById("retry-btn");

const frames = {};
let loaded = 0;
let readyStarted = false;
let lang = "zh-Hant";
let phase = "start";
let stageIndex = 0;
let holding = false;
let keyHold = false;
let pointerDown = false;
let swallowRelease = false;
let paused = false;
let sleep = 0;
let hands = STAGES[0].lives;
let saves = 0;
let hits = 0;
let startedAt = 0;
let frozenAt = 0;
let phaseUntil = 0;
let nextWarnAt = Infinity;
let lastNow = 0;
let statusKey = "loading";
let runMs = 0;
let cleared = 0;
let audioCtx = null;
let lastList = [];
let lastHighlight = "";
let boardNote = "";

function T() { return STR[lang] || STR["zh-Hant"]; }
function spec() { return STAGES[stageIndex]; }
function loadLang() {
  const saved = localStorage.getItem(LANG_KEY);
  lang = STR[saved] ? saved : "zh-Hant";
}
function gapMs() {
  const s = spec();
  const k = Math.max(0, Math.min(1, sleep / SLEEP_MAX));
  const base = s.gap0 + (s.gap1 - s.gap0) * k;
  const jitter = (Math.random() * 2 - 1) * base * 0.28;
  return Math.max(700, base + jitter);
}
function dangerMs() {
  return spec().danger * (1 - 0.15 * Math.max(0, Math.min(1, sleep / SLEEP_MAX)));
}

function showOverlay(title, lines, hint) {
  overlay.replaceChildren();
  const h = document.createElement("div");
  h.className = "ov-title";
  h.textContent = title;
  overlay.append(h);
  for (const line of lines) {
    const p = document.createElement("p");
    p.textContent = line;
    overlay.append(p);
  }
  if (hint) {
    const s = document.createElement("p");
    s.className = "ov-hint";
    s.textContent = hint;
    overlay.append(s);
  }
  overlay.hidden = false;
}
function setBanner(text, kind) {
  banner.textContent = text || "";
  banner.className = kind || "";
}
function poseName() {
  if (phase === "win" || phase === "clear") return "sleep";
  if (phase === "lose" || phase === "swat") return "swat";
  if (phase === "warn" || phase === "danger") return "warn";
  if (holding && (phase === "calm" || phase === "intro" || phase === "start")) return "pet";
  return "calm";
}
function showPose() {
  const img = frames[poseName()];
  if (img && img.complete && img.naturalWidth) view.src = img.src;
  stage.dataset.phase = phase;
  stage.dataset.hold = holding ? "1" : "0";
}
function elapsed(now) {
  if (phase === "start") return 0;
  if (paused || phase === "clear" || phase === "win" || phase === "lose") return Math.max(0, frozenAt - startedAt);
  return Math.max(0, now - startedAt);
}
function paint(now) {
  const t = T();
  const shown = Math.min(SLEEP_MAX, Math.floor(sleep));
  sleepNum.textContent = String(shown);
  sleepFill.style.width = Math.min(100, sleep) + "%";
  const maxLives = spec().lives;
  handsEl.replaceChildren();
  for (let i = 0; i < maxLives; i++) {
    const pip = document.createElement("div");
    pip.className = "pip" + (i < hands ? "" : " off");
    handsEl.append(pip);
  }
  document.getElementById("goal").textContent = t.goal(stageIndex + 1, t.names[stageIndex]);
  const map = {
    loading: t.loading,
    missing: t.missingTitle,
    start: t.startTitle,
    idle: t.idle,
    petting: t.petting,
    warn: t.warn,
    pull: t.pull,
    safe: t.safe,
    hit: t.hit,
    paused: t.pausedTitle,
    intro: t.intro(stageIndex + 1, t.names[stageIndex]),
    clear: t.clearedTitle(stageIndex + 1),
    win: t.winTitle,
    lose: t.loseTitle
  };
  statusEl.textContent = map[statusKey] || "";
  metaEl.textContent = phase === "start" ? "" : t.meta((elapsed(now) / 1000).toFixed(1), saves, hits);
  showPose();
}
function applyStatic() {
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("sleep-label").textContent = t.sleep;
  document.getElementById("hand-label").textContent = t.hands;
  document.getElementById("help").textContent = t.help;
  document.getElementById("pause-btn").textContent = t.pauseBtn;
  document.getElementById("name-label").textContent = t.name;
  document.getElementById("side-board-title").textContent = t.board;
  document.getElementById("end-board-title").textContent = t.board;
  saveBtn.textContent = t.save;
  nextBtn.textContent = t.next;
  retryBtn.textContent = t.retry;
  nameEl.placeholder = t.needName;
  document.querySelectorAll("[data-lang]").forEach((btn) => {
    btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
  });
  if (phase === "start" && readyStarted) showOverlay(t.startTitle, t.start, t.startHint);
  if (paused) showOverlay(t.pausedTitle, t.paused, t.pausedHint);
  if (phase === "clear") showOutcome("clear");
  if (phase === "win") showOutcome("win");
  if (phase === "lose") showOutcome("lose");
  paint(performance.now());
  renderBoards();
}
function showOutcome(kind) {
  const t = T();
  resultEl.hidden = false;
  const title = document.getElementById("result-title");
  const body = document.getElementById("result-body");
  if (kind === "clear") {
    title.textContent = t.clearedTitle(stageIndex + 1);
    body.textContent = t.clearedBody;
    formEl.hidden = true;
    document.getElementById("end-wrap").hidden = true;
    nextBtn.hidden = false;
    retryBtn.hidden = true;
    return;
  }
  formEl.hidden = false;
  document.getElementById("end-wrap").hidden = false;
  nextBtn.hidden = true;
  retryBtn.hidden = false;
  if (kind === "win") {
    title.textContent = t.winTitle;
    body.textContent = t.winBody;
  } else {
    title.textContent = t.loseTitle;
    body.textContent = t.loseBody(cleared);
  }
  const savedName = localStorage.getItem(NAME_KEY) || "";
  if (!nameEl.value) nameEl.value = [...savedName].slice(0, 10).join("");
}
function setLang(next) {
  if (!STR[next]) return;
  lang = next;
  localStorage.setItem(LANG_KEY, lang);
  applyStatic();
}
function ensureAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (err) {}
}
function blip(freq, dur, type) {
  try {
    if (!audioCtx || audioCtx.state !== "running") return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (err) {}
}
function releaseInputs() {
  holding = false;
  keyHold = false;
  pointerDown = false;
}
function beginRun(now) {
  stageIndex = 0;
  saves = 0;
  hits = 0;
  cleared = 0;
  paused = false;
  startedAt = now;
  lastNow = now;
  runMs = 0;
  swallowRelease = true;
  resultEl.hidden = true;
  saveBtn.disabled = false;
  saveMsg.textContent = "";
  overlay.hidden = true;
  releaseInputs();
  startStage(now);
}
function startStage(now) {
  sleep = 0;
  hands = spec().lives;
  phase = "intro";
  statusKey = "intro";
  phaseUntil = now + 900;
  nextWarnAt = phaseUntil + gapMs();
  setBanner(T().intro(stageIndex + 1, T().names[stageIndex]), "warn");
  overlay.hidden = true;
  resultEl.hidden = true;
  paint(now);
}
function enterWarn(now) {
  phase = "warn";
  statusKey = "warn";
  phaseUntil = now + spec().warn;
  setBanner(T().warn, "warn");
  blip(520, 0.08, "triangle");
}
function enterDanger(now) {
  phase = "danger";
  statusKey = "pull";
  phaseUntil = now + dangerMs();
  setBanner(T().pull, "pull");
  blip(880, 0.05, "square");
}
function enterCalm(now) {
  phase = "calm";
  statusKey = holding ? "petting" : "idle";
  nextWarnAt = now + gapMs();
  setBanner("", "");
}
function finishRun(now, kind) {
  releaseInputs();
  frozenAt = now;
  runMs = Math.max(1, Math.round(frozenAt - startedAt));
  phase = kind;
  statusKey = kind;
  setBanner("", "");
  showOutcome(kind);
  loadBoard();
}
function scratch(now) {
  hits += 1;
  hands -= 1;
  sleep = Math.max(0, sleep - spec().penalty);
  blip(110, 0.12, "sawtooth");
  setBanner(T().hit, "hit");
  if (hands <= 0) {
    cleared = stageIndex;
    finishRun(now, "lose");
    return;
  }
  phase = "swat";
  statusKey = "hit";
  phaseUntil = now + 700;
}
function savedPull(now) {
  saves += 1;
  phase = "safe";
  statusKey = "safe";
  phaseUntil = now + (stageIndex >= 8 ? 240 : 380);
  setBanner(T().safe, "safe");
  blip(660, 0.06, "sine");
}
function clearStage(now) {
  sleep = SLEEP_MAX;
  releaseInputs();
  frozenAt = now;
  if (stageIndex >= STAGES.length - 1) {
    cleared = STAGES.length;
    finishRun(now, "win");
    return;
  }
  phase = "clear";
  statusKey = "clear";
  setBanner("", "");
  showOutcome("clear");
}
function continueStage(now) {
  const gap = Math.max(0, now - frozenAt);
  startedAt += gap;
  lastNow = now;
  stageIndex += 1;
  releaseInputs();
  startStage(now);
}
function syncHold(now) {
  const prev = holding;
  holding = keyHold || pointerDown;
  if (swallowRelease) {
    if (!holding) swallowRelease = false;
    if (phase === "calm" || phase === "intro") statusKey = holding ? "petting" : (phase === "intro" ? "intro" : "idle");
    return;
  }
  if (prev && !holding && (phase === "calm" || phase === "intro")) {
    scratch(now || performance.now());
    paint(performance.now());
    return;
  }
  if (phase === "calm" || phase === "intro") statusKey = holding ? "petting" : (phase === "intro" ? "intro" : "idle");
}
function tick(now) {
  requestAnimationFrame(tick);
  if (!readyStarted || paused) return;
  if (lastNow && now - lastNow > 80 && phase !== "start" && phase !== "win" && phase !== "lose" && phase !== "clear") {
    const extra = now - lastNow - 16;
    phaseUntil += extra;
    nextWarnAt += extra;
    startedAt += extra;
  }
  const dt = lastNow ? Math.min(50, now - lastNow) : 16;
  lastNow = now;
  if (phase === "intro") {
    if (holding) sleep += spec().rate * dt / 1000;
    else sleep = Math.max(0, sleep - spec().decay * dt / 1000);
    if (sleep >= SLEEP_MAX) {
      clearStage(now);
      paint(now);
      return;
    }
    if (now >= phaseUntil) {
      phase = "calm";
      statusKey = holding ? "petting" : "idle";
      setBanner("", "");
    }
  } else if (phase === "calm") {
    if (holding) {
      sleep += spec().rate * dt / 1000;
      if (sleep >= SLEEP_MAX) {
        clearStage(now);
        paint(now);
        return;
      }
    } else sleep = Math.max(0, sleep - spec().decay * dt / 1000);
    if (now >= nextWarnAt) enterWarn(now);
  } else if (phase === "warn" && now >= phaseUntil) enterDanger(now);
  else if (phase === "danger" && now >= phaseUntil) {
    if (holding) scratch(now);
    else savedPull(now);
  } else if ((phase === "safe" || phase === "swat") && now >= phaseUntil) enterCalm(now);
  paint(now);
}
function togglePause() {
  if (phase === "start" || phase === "win" || phase === "lose" || phase === "clear") return;
  if (!paused) {
    paused = true;
    frozenAt = performance.now();
    showOverlay(T().pausedTitle, T().paused, T().pausedHint);
    paint(frozenAt);
    return;
  }
  const now = performance.now();
  const gap = now - frozenAt;
  if (gap > 0) {
    startedAt += gap;
    phaseUntil += gap;
    nextWarnAt += gap;
  }
  paused = false;
  overlay.hidden = true;
  lastNow = now;
}
function onPress(now) {
  ensureAudio();
  if (paused) {
    togglePause();
    swallowRelease = true;
    releaseInputs();
    return;
  }
  if (phase === "start") beginRun(now);
}

function cleanName(raw) {
  const trimmed = String(raw || "").replace(/[\u0000-\u001f*]/g, "").trim();
  return [...trimmed].slice(0, 10).join("");
}
function normalize(list) {
  const rows = [];
  const seen = new Set();
  for (const row of list || []) {
    if (!row || typeof row.name !== "string") continue;
    const name = cleanName(row.name);
    const ms = Math.round(Number(row.ms));
    const stageNo = Math.round(Number(row.stage));
    const at = typeof row.at === "string" ? row.at : "";
    if (!name || !Number.isFinite(ms) || ms <= 0 || ms > 3600000) continue;
    if (!Number.isFinite(stageNo) || stageNo < 0 || stageNo > 10 || !at || !Number.isFinite(Date.parse(at))) continue;
    const id = name + "|" + stageNo + "|" + ms + "|" + at;
    if (seen.has(id)) continue;
    seen.add(id);
    rows.push({ name, stage: stageNo, ms, at });
  }
  rows.sort((a, b) => b.stage - a.stage || a.ms - b.ms || (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  return rows.slice(0, KEEP_N);
}
function rowKey(row) { return row.name + "|" + row.stage + "|" + row.ms + "|" + row.at; }
function readLocal() {
  try { return normalize(JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]")); }
  catch (err) { return []; }
}
function writeLocal(list) { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); }
function formatWhen(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const p = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + p(date.getMonth() + 1) + "-" + p(date.getDate()) + " " + p(date.getHours()) + ":" + p(date.getMinutes());
}
function renderInto(el, list) {
  el.replaceChildren();
  const top = list.slice(0, TOP_N);
  if (!top.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = boardNote || T().empty;
    el.append(li);
    return;
  }
  top.forEach((row, i) => {
    const li = document.createElement("li");
    if (rowKey(row) === lastHighlight) li.className = "mine";
    const rank = document.createElement("span");
    rank.textContent = String(i + 1);
    const name = document.createElement("span");
    name.textContent = row.name;
    const score = document.createElement("span");
    score.textContent = T().rankStage(row.stage);
    const when = document.createElement("span");
    when.textContent = (row.ms / 1000).toFixed(1) + T().unit + " " + formatWhen(row.at);
    li.append(rank, name, score, when);
    el.append(li);
  });
}
function renderBoards() {
  renderInto(document.getElementById("side-board"), lastList);
  renderInto(document.getElementById("end-board"), lastList);
}
async function fetchRemote() {
  const resp = await fetch(BOARD_URL, { cache: "no-store" });
  if (resp.status === 404) return [];
  if (!resp.ok) throw new Error(String(resp.status));
  const data = await resp.json();
  if (!Array.isArray(data)) throw new Error("shape");
  return normalize(data);
}
async function putRemote(list) {
  const resp = await fetch(BOARD_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(list.map((row) => ({ name: row.name, stage: row.stage, ms: row.ms, at: row.at })))
  });
  if (!resp.ok) throw new Error(String(resp.status));
}
async function loadBoard() {
  const local = readLocal();
  try {
    const remote = await fetchRemote();
    lastList = normalize(remote.concat(local));
    boardNote = "";
    writeLocal(lastList);
  } catch (err) {
    lastList = local;
    boardNote = local.length ? "" : T().boardDown;
  }
  renderBoards();
}
async function submitScore(event) {
  event.preventDefault();
  event.stopPropagation();
  const name = cleanName(nameEl.value);
  if (!name) {
    saveMsg.textContent = T().needName;
    return;
  }
  if (runMs <= 0) return;
  saveMsg.textContent = "";
  saveBtn.disabled = true;
  const at = new Date().toISOString();
  const row = { name, stage: cleared, ms: runMs, at };
  localStorage.setItem(NAME_KEY, name);
  lastHighlight = rowKey(row);
  let base = readLocal();
  let online = false;
  try {
    base = normalize((await fetchRemote()).concat(base));
    online = true;
  } catch (err) {
    online = false;
  }
  const next = normalize(base.concat([row]));
  writeLocal(next);
  lastList = next;
  renderBoards();
  saveMsg.textContent = online ? "" : T().savedLocal;
  if (!online) return;
  try {
    await putRemote(next);
    saveMsg.textContent = T().saved;
  } catch (err) {
    saveMsg.textContent = T().savedLocal;
  }
}

formEl.addEventListener("submit", submitScore);
nextBtn.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  if (phase !== "clear") return;
  continueStage(performance.now());
});
retryBtn.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  if (phase !== "win" && phase !== "lose") return;
  beginRun(performance.now());
});
document.getElementById("pause-btn").addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  togglePause();
});
document.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-lang]");
  if (!btn) return;
  event.preventDefault();
  event.stopPropagation();
  setLang(btn.dataset.lang);
});
stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  if (event.target.closest("[data-lang], button, #score-form")) return;
  if (phase === "clear" || phase === "win" || phase === "lose") return;
  event.preventDefault();
  pointerDown = true;
  try { stage.setPointerCapture(event.pointerId); } catch (err) {}
  onPress(performance.now());
  syncHold();
});
window.addEventListener("pointerup", () => { pointerDown = false; syncHold(); });
window.addEventListener("pointercancel", () => { pointerDown = false; syncHold(); });
window.addEventListener("keydown", (event) => {
  if (event.target.closest("input, textarea, button")) return;
  if (event.repeat) return;
  if (event.code === "Escape") {
    event.preventDefault();
    togglePause();
    return;
  }
  if (event.code === "Space") {
    if (phase === "clear" || phase === "win" || phase === "lose") {
      event.preventDefault();
      return;
    }
    event.preventDefault();
    keyHold = true;
    onPress(performance.now());
    syncHold();
  }
});
window.addEventListener("keyup", (event) => {
  if (event.code !== "Space") return;
  keyHold = false;
  syncHold();
});

loadLang();
applyStatic();
loadBoard();

const needed = Object.keys(ART).length;
for (const name of Object.keys(ART)) {
  const img = new Image();
  frames[name] = img;
  const done = () => {
    if (img.__counted) return;
    img.__counted = true;
    loaded += 1;
    if (!readyStarted) {
      const title = overlay.querySelector(".ov-title");
      if (title) title.textContent = T().loading + " " + loaded + " / " + needed;
    }
    if (loaded === needed) boot();
  };
  img.onload = done;
  img.onerror = done;
  img.src = ART[name];
  if (img.complete) done();
}
function boot() {
  const failed = Object.values(frames).filter((img) => !img.naturalWidth).length;
  if (failed) {
    showOverlay(T().missingTitle, [T().missing], "");
    statusKey = "missing";
    paint(performance.now());
    return;
  }
  readyStarted = true;
  phase = "start";
  statusKey = "start";
  showPose();
  showOverlay(T().startTitle, T().start, T().startHint);
  paint(performance.now());
  requestAnimationFrame(tick);
}
</script>
</body>
